name: lab6 github actions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017

    env:
      MONGODB_URL: mongodb://127.0.0.1:27017/week3
      FRONTEND_ORIGIN: http://localhost:3000
      JWT_ACCESS_SECRET: test access secret
      JWT_REFRESH_SECRET: test refresh secret
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
